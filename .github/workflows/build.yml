name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        engine: [cropmood, upstream]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            python3-docutils python3-pil zip unzip ffmpeg
      - name: Unit tests
        run: make -C sim test
      - name: Fetch engine
        run: scripts/fetch.sh ${{ matrix.engine }}
      - name: Build
        run: scripts/build.sh ${{ matrix.engine }}
      - name: UI previews
        if: matrix.engine == 'cropmood'
        run: make -C sim preview e2e-video
      - uses: actions/upload-artifact@v4
        with:
          name: mothlight-${{ matrix.engine }}
          path: |
            out/${{ matrix.engine }}/*.zip
            out/preview/*.png
            out/preview/*.gif
            out/preview/*.mp4
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.engine == 'cropmood'
        uses: softprops/action-gh-release@v2
        with:
          files: out/cropmood/*.zip
          prerelease: true
